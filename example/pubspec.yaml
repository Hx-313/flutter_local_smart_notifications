name: notification_lab
description: A capability lab for flutter_local_smart_notifications.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_smart_notifications:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
